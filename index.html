    .portfolio-text {

    .portfolio-text::before {

      background: linear-gradient(45deg,

      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 3s ease infinite;

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }

<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <canvas id="stars-canvas"></canvas>
    <div class="intro-container">
      <div class="glow-effect glow-1"></div>
      <div class="glow-effect glow-2"></div>
      <h1 class="portfolio-text">
        <span>P</span><span>O</span><span>R</span><span>T</span><span>I</span><span>F</span><span>O</span><span>L</span><span>I</span><span>O</span>
      </h1>
      <div class="underline"></div>
      <p class="subtitle">GEAN JR.</p>
    </div>
  </div>
  
  <script>
    // Create galaxy starfield
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const stars = [];
    const galaxyColors = [
      'rgba(139, 92, 246, ',  // purple
      'rgba(236, 72, 153, ',  // pink
      'rgba(59, 130, 246, ',  // blue
      'rgba(6, 182, 212, ',   // cyan
      'rgba(168, 85, 247, ',  // light purple
      'rgba(255, 255, 255, '  // white
    ];
    
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.5 + 0.1,
        opacity: Math.random(),
        color: galaxyColors[Math.floor(Math.random() * galaxyColors.length)]
      });
    }
    
    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color + star.opacity + ')';
        ctx.shadowBlur = 15;
        ctx.shadowColor = star.color + '0.8)';
        ctx.fill();
        
        star.opacity += star.speed * 0.02;
        if (star.opacity > 1 || star.opacity < 0) star.speed *= -1;
      });
      requestAnimationFrame(animateStars);
    }
    animateStars();
    
    window.addEventListener('resize', function() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Animate PORTFOLIO letters
    const letters = document.querySelectorAll('.portfolio-text span');
    const underline = document.querySelector('.underline');
    const subtitle = document.querySelector('.subtitle');
    
    letters.forEach(function(letter, index) {
      setTimeout(function() {
        letter.style.animation = 'letterPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards';
      }, index * 80);
    });
    
    setTimeout(function() {
      underline.style.transition = 'width 0.8s ease-out';
      underline.style.width = '80%';
    }, letters.length * 80 + 200);
    
    setTimeout(function() {
      subtitle.style.transition = 'opacity 0.6s ease-out';
      subtitle.style.opacity = '1';
    }, letters.length * 80 + 600);
  </script>
  
  <script>
    let splashRemoved = false;
    
    function removeSplash() {
      if (splashRemoved) return;
      splashRemoved = true;
      
      console.log('Removing splash screen - Flutter is ready!');
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function() {
          splash.remove();
          document.body.style.overflow = 'auto';
        }, 500);
      }
    }
    
    // Wait for window load
    window.addEventListener('load', function() {
      console.log('Window loaded, checking for Flutter...');
      
      // Check every 50ms if Flutter has rendered content
      let checkCount = 0;
      const maxChecks = 100;
      
      const checkInterval = setInterval(function() {
        checkCount++;
        
        // Check multiple Flutter elements
        const glassPane = document.querySelector('flt-glass-pane');
        const flutterView = document.querySelector('flutter-view');
        const semantics = document.querySelector('flt-semantics-host');
        
        // If any Flutter element has meaningful content
        const hasContent = (glassPane && glassPane.children.length > 0) ||
                          (flutterView && flutterView.children.length > 0) ||
                          (semantics);
        
        if (hasContent) {
          console.log('Flutter content detected! Check count: ' + checkCount);
          clearInterval(checkInterval);
          removeSplash();
        } else if (checkCount >= maxChecks) {
          console.log('Max checks reached, removing splash anyway');
          clearInterval(checkInterval);
          removeSplash();
        }
      }, 50);
    });
    
    // Absolute fallback - 5 seconds max
    setTimeout(function() {
      console.log('5 second fallback triggered');
      removeSplash();
    }, 5000);
  </script>
